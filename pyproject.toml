[project]
name = "cartola"
version = "0.1.0"
description = "Organização e painel dos campeonatos do Cartola FC — Djamba Feipa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "atualizar_rodada",
    "caminhos",
    "campeonato",
    "config_temporada",
    "copa",
    "dados",
    "estoque",
    "liga",
    "paginas",
    "ui",
]
